<!doctype html>

<html lang="es">


  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TP-02-JS-Async-PokeAPI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body>
    
    <main class="container py-4">

    <h1 class="text-center mb-4">Buscar Pokémon</h1>

  <form id="buscador" class="row g-2 mb-4">
    <div class="col-12 col-sm">
      <input id="buscadorTexto" type="text" class="form-control" placeholder="Nombre del Pokémon">
    </div>
    <div class="col-6 col-sm-auto d-grid">
      <button type="submit" class="btn btn-danger">Buscar</button>
    </div>
    <div class="col-6 col-sm-auto d-grid">
      <button id="btnVolver" type="button" class="btn btn-secondary">Volver</button>
    </div>
  </form>

  <div id="spinner" class="text-center my-4 d-none">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div id="cards" class="row g-3"></div>

</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/main.js"></script>
  </body>

</html>
